name: eco-server

services:
  eco:
    image: strangeloopgames/eco-game-server:${ECO_VERSION:-latest}
    container_name: eco-server
    restart: unless-stopped
    environment:
      # Passed as an env var, not a command-line argument, so the token does not
      # show up in `docker inspect` / `ps` output.
      ECO_TOKEN: ${ECO_TOKEN:-}
    # Fixes the image's Steam lookup, installs mods, then starts the server.
    command: sh /entrypoint.sh
    # Eco saves the world on SIGTERM — give it room to finish.
    stop_grace_period: 120s
    ports:
      - "${GAME_PORT:-3000}:3000/udp" # game
      - "${WEB_PORT:-3001}:3001/tcp" # web UI / API
      # - "3002:3002/tcp"               # RCON (set RconPassword in Network.eco first)
      - "3003:3003/udp" # Steam query, needed for the Steam server browser
    volumes:
      - eco-storage:/app/Storage
      # Configs live in the repo so you can edit them in an editor and diff them.
      # The world save stays in a named volume — it is large, binary and churns.
      - ./Configs:/app/Configs
      - ./scripts/entrypoint.sh:/entrypoint.sh:ro
      # Built by scripts/fetch-mods.sh; copied into /app on every start.
      - ./mods-installed:/mods-installed:ro
    # ponytail: /app/Mods is deliberately NOT mounted — the image keeps the game's
    # own content there (Mods/__core__), so a volume would freeze it at whatever
    # the image shipped when the volume was created and break the next update.

volumes:
  eco-storage:
